# Builds visage/ and publishes it to GitHub Pages, e.g. https://kushwaha-pankaj.github.io/cute-orb/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy Visage to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['visage/**', '.github/workflows/deploy-visage.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visage/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is "/cute-orb" on github.io and "" on a custom domain.
      - run: npm run build
        env:
          VISAGE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: visage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
